<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TMICC-STORE</title>
<style>
:root{
  --bg:#f5f2ea; --panel:#fffdf9; --ink:#1d2b35; --muted:#5f6e77; --line:#d9d1c4; --brand:#b8834d; --brand2:#11263a;
  --good:#2f6f50; --bad:#8a3d38; --warn:#c38b2d; --shadow:0 8px 24px rgba(17,38,58,.08);
}
*{box-sizing:border-box}html,body{margin:0;padding:0;font:16px/1.5 Inter,Segoe UI,sans-serif;background:linear-gradient(180deg,#f7f3ec,#efeae0);color:var(--ink)}
body{padding:20px}
header{max-width:1100px;margin:0 auto 16px;background:rgba(255,255,255,.78);backdrop-filter:blur(6px);border:1px solid var(--line);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:14px}
.brand .mark{width:12px;height:12px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(184,131,77,.15)}
nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:8px;transition:.15s ease}
button:hover{transform:translateY(-1px)}
button.p{background:var(--brand2);color:#fff;border-color:var(--brand2)}
button.d{background:#fff;color:var(--bad);border-color:#e0b0ac}
button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;background:rgba(255,255,255,.72);border:1px solid var(--line);padding:16px;box-shadow:var(--shadow)}
.meta{font-size:.85rem;color:var(--muted);margin-bottom:12px}
#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 10px rgba(17,38,58,.03)}
.c.out{border-left:4px solid var(--bad)}
.c.low{border-left:4px solid var(--warn)}
.code{font-weight:800;letter-spacing:.04em;color:var(--brand2);font-size:.8rem;margin-bottom:6px}
.desc{font-weight:700;font-size:1.1rem;color:var(--ink);margin-bottom:8px}
.long{color:var(--muted);font-size:.9rem;margin-bottom:10px}
.qty{font-weight:700;font-size:1.1rem}
.qty small{font-size:.78rem;color:var(--muted)}
.meta-inline{font-size:.8rem;color:var(--muted)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.g div{font-size:.8rem;color:var(--muted)}
.g b{display:block;color:var(--ink);font-size:.77rem;margin-bottom:3px}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
[hidden]{display:none!important}
dialog{border:none;border-radius:16px;padding:0;box-shadow:0 18px 40px rgba(17,38,58,.22)}
dialog::backdrop{background:rgba(16,25,30,.45)}
form{padding:18px 20px;min-width:min(480px,90vw)}
form b{display:block;font-size:1.1rem;margin-bottom:12px}
label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:8px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:6px;background:#fff;color:var(--ink)}
#ef{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#ef label{grid-column:1/-1}
#ef label[style*="grid-column:1/3"]{grid-column:1/-1}
.err{color:var(--bad);font-size:.82rem;min-height:1.2em;margin-top:6px}
#more{display:block;width:100%;margin-top:18px;background:var(--brand2);color:#fff;border-color:var(--brand2)}
@media (max-width:640px){body{padding:12px}#ef{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.brand{font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><span class="mark"></span> TMICC-STORE</div>
    <nav>
      <div class="tabs">
        <button id="t0" class="on">Inventory</button>
        <button id="t1">VMI parts</button>
      </div>
      <div class="row" id="own" hidden>
        <button class="p" id="add">Add material</button>
        <button id="exp">Export data.json</button>
        <button id="rst">Discard my changes</button>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="meta" id="meta"></div>
  <div id="list"></div>
  <button id="more" hidden>Show more</button>
</main>

<dialog id="lg">
  <form method="dialog" id="lf">
    <b>Owner login</b>
    <label>Password
      <input id="pw" type="password" autocomplete="current-password">
    </label>
    <div class="err" id="le"></div>
    <div class="row" style="margin-top:10px">
      <button class="p" id="lgo" type="button">Log in</button>
      <button value="x">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="ed">
  <form method="dialog">
    <b id="et">Material</b>
    <div class="f2" id="ef"></div>
    <div class="err" id="ee"></div>
    <div class="row" style="margin-top:10px">
      <button class="p" id="sv" type="button">Save</button>
      <button value="x">Cancel</button>
    </div>
  </form>
</dialog>

<script>
const HASH="018ec9b448f93bc8a5a3c82c3b784c1d0c46f4d4bfb094fc2bc4684bc96a96e4",KEY="engg_owner_draft",S="engg_owner_session";
const F=[["Material code",0],["Description",1],["Long description",2],["OEM number",3],["UOM",4],["Qty",5,1],["VMI stock",6,1],["Location",7],["Min",8,1],["Max",9,1],["Department / area",10],["Machine area",11],["End user",12],["Allocation",13]];
let D=null,inv=[],vmi=[],tab=0,res=[],shown=0,owner=false,edit=-1;
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;", ">":"&gt;", '"':"&quot;"}[c]));
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function draft(){try{const d=localStorage.getItem(KEY);return d?JSON.parse(d):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(inv))}catch(e){alert("Could not save in this browser. Use Export data.json.")}}
async function load(){try{D=await(await fetch("data.json?"+Date.now())).json()}catch(e){$("meta").textContent="Could not load data.json";return}
 inv=D.inv;vmi=D.vmi;if(sessionStorage.getItem(S)==="1")setOwner(true);else run()}
function setOwner(on){owner=on;$("own").hidden=!on;$("adm").textContent=on?"Log out":"Owner login";$("who").textContent=on?"Owner":"";
 if(on){sessionStorage.setItem(S,"1");const d=draft();if(d)inv=d}else{sessionStorage.removeItem(S);inv=D.inv}run()}
function run(){const q=$("q").value.trim().toLowerCase(),f=$("fld").value,src=tab?vmi:inv;
 const m=r=>{if(!q)return 1;if(tab){const a=[r[3],r[1],r[2],r[0]];return(f==="all"?a.join(" "):f==="0"?r[3]:f==="1"?r[1]:f==="3"?r[0]:f==="7"?r[2]:a.join(" ")).toLowerCase().includes(q)}
  const t=f==="all"?r[0]+" "+r[1]+" "+r[2]+" "+r[3]+" "+r[7]+" "+r[12]+" "+r[11]+" "+r[10]:String(r[+f]);return t.toLowerCase().includes(q)};
 res=[];src.forEach((r,i)=>{if(m(r))res.push(i)});shown=0;$("list").innerHTML="";page()}
function card(i){const r=inv[i];const st=r[5]<=0?"out":(r[8]>0&&r[5]<r[8]?"low":"");
 return '<div class="c '+st+'"><div class="code">'+esc(r[0])+'</div><div class="desc">'+esc(r[1])+'</div>'+(r[2]?'<div class="long">'+esc(r[2])+'</div>':'')+
 '<div class="row" style="justify-content:space-between"><span class="qty">'+r[5]+' <small>'+esc(r[4])+'</small></span><span class="meta-inline" style="margin:0">'+(r[6]?'VMI '+r[6]:"")+'</span></div><div class="g">'+
 [["Location",r[7]],["Min / Max",r[8]+" / "+r[9]],["Department",r[10]],["Machine area",r[11]],["End user",r[12]],["OEM no.",r[3]],["Open PO",r[14]||""],["PR in process",r[15]||""]].filter(x=>x[1]!==""&&x[1]!="0 / 0").map(x=>'<div><b>'+x[0]+'</b>'+esc(x[1])+'</div>').join("")+'</div>'+
 (owner?'<div class="act"><button data-e="'+i+'">Edit</button><button class="d" data-x="'+i+'">Delete</button></div>':'')+'</div>'}
function vcard(i){const r=vmi[i];return '<div class="c"><div class="code">'+esc(r[3]||r[0])+'</div><div class="desc">'+esc(r[1])+'</div><div class="row" style="justify-content:space-between"><span class="qty">'+r[5]+' <small>'+esc(r[4])+'</small></span></div><div class="g"><div><b>Part no.</b>'+esc(r[0])+'</div><div><b>Bin</b>'+esc(r[2])+'</div><div><b>Min / Max</b>'+r[6]+" / "+r[7]+'</div></div></div>'}
function page(){const n=Math.min(res.length,shown+60);let h="";for(let k=shown;k<n;k++)h+=tab?vcard(res[k]):card(res[k]);$("list").insertAdjacentHTML("beforeend",h);shown=n;
 $("more").hidden=shown>=res.length;$("meta").textContent=res.length+" "+(tab?"VMI parts":"materials")+(res.length?"":" — nothing matches. Try another word or field.")+" · data "+D.built}
function form(i){edit=i;const r=i>=0?inv[i]:F.map(f=>f[2]?0:"");$("et").textContent=i>=0?"Edit material":"Add material";$("ee").textContent="";
 $("ef").innerHTML=F.map(f=>'<label'+(f[1]<2?' style="grid-column:1/3"':'')+'>'+f[0]+'<input data-k="'+f[1]+'" '+(f[2]?'type="number" step="any"':'')+' value="'+esc(r[f[1]])+'"></label>').join("");$("ed").showModal()}
$("q").oninput=run;$("fld").onchange=run;$("more").onclick=page;
[0,1].forEach(t=>$("t"+t).onclick=()=>{tab=t;$("t0").className=t?"":"on";$("t1").className=t?"on":"";run()});
$("adm").onclick=()=>{if(owner)setOwner(false);else{$("pw").value="";$("le").textContent="";$("lg").showModal()}};
$("lgo").onclick=async()=>{if(await sha($("pw").value)===HASH){$("lg").close();setOwner(true)}else$("le").textContent="Wrong password."};
$("lf").onsubmit=e=>{if(e.submitter&&e.submitter.id==="lgo")e.preventDefault()};
$("add").onclick=()=>form(-1);
$("list").onclick=e=>{const b=e.target.closest("button");if(!b||!owner)return;if(b.dataset.e)form(+b.dataset.e);
 if(b.dataset.x&&confirm("Delete "+inv[+b.dataset.x][0]+"?")){inv.splice(+b.dataset.x,1);save();run()}};
$("sv").onclick=()=>{const r=edit>=0?inv[edit].slice():F.map(f=>f[2]?0:"");$("ef").querySelectorAll("input").forEach(i=>{const k=+i.dataset.k;r[k]=F.find(f=>f[1]===k)[2]?(+i.value||0):i.value.trim()});
 if(!r[0]||!r[1]){$("ee").textContent="Material code and description are required.";return}
 if(inv.some((x,i)=>x[0]===r[0]&&i!==edit)){$("ee").textContent="This material code already exists.";return}
 while(r.length<16)r.push(0);if(edit>=0)inv[edit]=r;else inv.unshift(r);save();$("ed").close();$("q").value=r[0];$("fld").value="0";run()};
$("exp").onclick=()=>{const o=Object.assign({},D,{inv,built:new Date().toISOString().slice(0,10)});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download="data.json";a.click()};
$("rst").onclick=()=>{if(confirm("Discard all changes not yet published?")){localStorage.removeItem(KEY);inv=D.inv;run()}};
load();
</script>
</body>
</html>
