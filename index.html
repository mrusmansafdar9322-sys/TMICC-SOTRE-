<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TMICC Store - Premium Inventory Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: 'Poppins', sans-serif;
  background: #ffffff;
  color: #202124;
}

:root {
  --primary: #1f6f93;
  --primary-light: #2a8bc7;
  --primary-dark: #154360;
  --accent: #d4a574;
  --accent-light: #e8c4a8;
  --bg-light: #f8f9fa;
  --bg-white: #ffffff;
  --text-primary: #202124;
  --text-secondary: #5f6368;
  --border: #dadce0;
  --error: #d33b27;
  --success: #0d652d;
  --warning: #e37400;
  --shadow-1: 0 1px 2px rgba(32, 33, 36, 0.1);
  --shadow-2: 0 1px 3px rgba(32, 33, 36, 0.12), 0 1px 2px rgba(32, 33, 36, 0.24);
  --shadow-3: 0 3px 6px rgba(32, 33, 36, 0.15), 0 2px 4px rgba(32, 33, 36, 0.12);
}

/* Header */
header {
  background: linear-gradient(135deg, #1f6f93 0%, #2a8bc7 100%);
  padding: 32px 24px;
  box-shadow: var(--shadow-2);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-container {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #ffffff;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  backdrop-filter: blur(10px);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.tabs-group {
  display: flex;
  gap: 8px;
  background: rgba(255, 255, 255, 0.15);
  padding: 4px;
  border-radius: 8px;
  backdrop-filter: blur(10px);
}

.tab-btn {
  padding: 8px 16px;
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.7);
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  border-radius: 6px;
  transition: all 0.3s ease;
}

.tab-btn.active {
  background: #ffffff;
  color: #1f6f93;
  font-weight: 600;
}

.tab-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.25);
}

#adm {
  background: rgba(255, 255, 255, 0.25);
  color: #ffffff;
  padding: 10px 20px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  font-size: 14px;
  transition: all 0.3s ease;
  font-family: inherit;
}

#adm:hover {
  background: rgba(255, 255, 255, 0.35);
  border-color: rgba(255, 255, 255, 0.5);
}

/* Search Section */
.search-section {
  max-width: 1400px;
  margin: 48px auto;
  padding: 0 24px;
}

.search-container {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.search-box {
  flex: 1;
  min-width: 300px;
  position: relative;
}

#q {
  width: 100%;
  padding: 14px 18px 14px 44px;
  border: 1px solid var(--border);
  border-radius: 24px;
  font-size: 16px;
  font-family: inherit;
  transition: all 0.3s ease;
  background: #f8f9fa;
}

#q:focus {
  outline: none;
  border-color: var(--primary);
  background: #ffffff;
  box-shadow: 0 1px 6px rgba(31, 111, 147, 0.2);
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 18px;
}

#fld {
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: #ffffff;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s ease;
}

#fld:hover {
  border-color: var(--primary);
}

#fld:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 1px 4px rgba(31, 111, 147, 0.15);
}

.search-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn-primary {
  padding: 10px 18px;
  background: var(--primary);
  color: #ffffff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s ease;
}

.btn-primary:hover {
  background: var(--primary-dark);
  box-shadow: var(--shadow-2);
  transform: translateY(-2px);
}

.btn-secondary {
  padding: 10px 18px;
  background: var(--bg-light);
  color: var(--primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s ease;
}

.btn-secondary:hover {
  background: #ffffff;
  border-color: var(--primary);
  box-shadow: var(--shadow-1);
}

#own {
  display: none;
  gap: 8px;
}

#own.active {
  display: flex;
}

/* Main Content */
main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 48px;
}

.meta {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 24px 0 32px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.meta::before {
  content: '';
  width: 4px;
  height: 4px;
  background: var(--primary);
  border-radius: 50%;
}

/* Grid Layout */
#list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

/* Card Styles */
.c {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.3s ease;
  box-shadow: var(--shadow-1);
  position: relative;
  overflow: hidden;
}

.c::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  opacity: 0;
  transition: opacity 0.3s ease;
}

.c:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-3);
  transform: translateY(-4px);
}

.c:hover::before {
  opacity: 1;
}

.c.out {
  border-left: 4px solid var(--error);
}

.c.low {
  border-left: 4px solid var(--warning);
}

.code {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--primary);
  text-transform: uppercase;
  margin-bottom: 8px;
  display: block;
}

.desc {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.4;
}

.long {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  line-height: 1.5;
}

.qty-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--bg-light);
  border-bottom: 1px solid var(--bg-light);
  margin-bottom: 16px;
}

.qty {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}

.qty small {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
  display: block;
  margin-top: 2px;
}

.meta-inline {
  font-size: 12px;
  color: var(--text-secondary);
}

.details-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

.detail-item {
  background: var(--bg-light);
  padding: 10px;
  border-radius: 6px;
  font-size: 12px;
}

.detail-label {
  font-weight: 600;
  color: var(--primary);
  display: block;
  margin-bottom: 3px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.detail-value {
  color: var(--text-primary);
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--bg-light);
}

.btn-edit {
  flex: 1;
  padding: 8px 12px;
  background: var(--primary);
  color: #ffffff;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s ease;
}

.btn-edit:hover {
  background: var(--primary-dark);
}

.btn-delete {
  flex: 1;
  padding: 8px 12px;
  background: #fff5f5;
  color: var(--error);
  border: 1px solid #ffe0de;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s ease;
}

.btn-delete:hover {
  background: #ffebea;
  border-color: var(--error);
}

/* Load More Button */
#more {
  display: block;
  width: 100%;
  padding: 14px;
  background: #f8f9fa;
  border: 1px solid var(--border);
  color: var(--primary);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s ease;
  margin: 32px 0;
}

#more:hover {
  background: #ffffff;
  border-color: var(--primary);
  box-shadow: var(--shadow-1);
}

/* Dialogs */
dialog {
  border: none;
  border-radius: 12px;
  box-shadow: var(--shadow-3);
  max-width: 500px;
  width: 90%;
  padding: 0;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

dialog::backdrop {
  background: rgba(32, 33, 36, 0.3);
  backdrop-filter: blur(4px);
}

dialog form {
  padding: 28px;
}

dialog b {
  display: block;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 16px;
}

label > span {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

input[type="text"],
input[type="password"],
input[type="number"],
textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  transition: all 0.3s ease;
}

input[type="text"]:focus,
input[type="password"]:focus,
input[type="number"]:focus,
textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 1px 4px rgba(31, 111, 147, 0.15);
  background: #ffffff;
}

#ef {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

.err {
  color: var(--error);
  font-size: 13px;
  margin-top: 8px;
  min-height: 18px;
  display: block;
}

.dialog-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

dialog button {
  flex: 1;
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s ease;
}

.btn-save {
  background: var(--primary);
  color: #ffffff;
}

.btn-save:hover {
  background: var(--primary-dark);
}

.btn-cancel {
  background: var(--bg-light);
  color: var(--text-primary);
  border: 1px solid var(--border);
}

.btn-cancel:hover {
  background: #ffffff;
  border-color: var(--primary);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-secondary);
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state-text {
  font-size: 16px;
  font-weight: 500;
}

/* Responsive */
@media (max-width: 768px) {
  header {
    padding: 20px 16px;
  }

  .header-container {
    flex-direction: column;
    gap: 16px;
  }

  .search-container {
    flex-direction: column;
  }

  .search-box {
    min-width: auto;
  }

  #list {
    grid-template-columns: 1fr;
  }

  #ef {
    grid-template-columns: 1fr;
  }

  dialog {
    width: 95%;
  }

  dialog form {
    padding: 20px;
  }
}

.who {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.8);
  font-weight: 500;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="brand">
      <div class="brand-icon">T</div>
      <span>TMICC Store</span>
    </div>
    <div class="nav-right">
      <div class="tabs-group">
        <button id="t0" class="tab-btn active">Inventory</button>
        <button id="t1" class="tab-btn">VMI Parts</button>
      </div>
      <div class="who" id="who"></div>
      <button id="adm">Login</button>
    </div>
  </div>
</header>

<div class="search-section">
  <div class="search-container">
    <div class="search-box">
      <div class="search-icon">🔍</div>
      <input type="text" id="q" placeholder="Search materials, parts, codes...">
    </div>
    <select id="fld">
      <option value="all">All Fields</option>
      <option value="0">Material Code</option>
      <option value="1">Description</option>
      <option value="3">OEM Number</option>
      <option value="7">Location</option>
    </select>
    <div class="search-controls" id="own">
      <button class="btn-primary" id="add">+ Add Material</button>
      <button class="btn-secondary" id="exp">Export</button>
      <button class="btn-secondary" id="rst">Discard</button>
    </div>
  </div>
</div>

<main>
  <div class="meta" id="meta">Loading materials...</div>
  <div id="list"></div>
  <button id="more" hidden>Show More Results</button>
</main>

<dialog id="lg">
  <form method="dialog" id="lf">
    <b>Owner Login</b>
    <label>
      <span>Password</span>
      <input id="pw" type="password" autocomplete="current-password">
    </label>
    <div class="err" id="le"></div>
    <div class="dialog-actions">
      <button class="btn-save" id="lgo" type="button">Sign In</button>
      <button class="btn-cancel" value="x">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="ed">
  <form method="dialog">
    <b id="et">Edit Material</b>
    <div id="ef"></div>
    <div class="err" id="ee"></div>
    <div class="dialog-actions">
      <button class="btn-save" id="sv" type="button">Save Changes</button>
      <button class="btn-cancel" value="x">Cancel</button>
    </div>
  </form>
</dialog>

<script>
const HASH = "018ec9b448f93bc8a5a3c82c3b784c1d0c46f4d4bfb094fc2bc4684bc96a96e4";
const KEY = "engg_owner_draft";
const S = "engg_owner_session";
const F = [
  ["Material code",0],
  ["Description",1],
  ["Long description",2],
  ["OEM number",3],
  ["UOM",4],
  ["Qty",5,1],
  ["VMI stock",6,1],
  ["Location",7],
  ["Min",8,1],
  ["Max",9,1],
  ["Department / area",10],
  ["Machine area",11],
  ["End user",12],
  ["Allocation",13]
];

const defaultData = {
  built: new Date().toISOString().slice(0,10),
  inv: [
    ["65196243","O-RING 42X34X4MM","Precision O-ring seal","","PC",0,0,"Rack A1",0,50,"Store","Assembly","Production","Critical","",""],
    ["65201475","ROPE MADE OF JUTE","Natural jute rope","","ROLL",12,8,"Warehouse A",5,20,"Store","Packing","Production","Standard","PO-2024-001","In Transit"],
    ["BOLT-110","HEX BOLT M8X30","Stainless steel bolt","HB-110","PC",24,12,"Rack 2",10,50,"Store","Assembly","Production","Standard","",""],
    ["GASK-200","GASKET 1/2 INCH","Rubber gasket seal","GSK-200","PC",16,0,"Rack 4",5,30,"Store","Assembly","Production","Standard","",""]
  ],
  vmi: [
    ["VMI-001","Fastener Kit","A-01","VMI-001","SET",12,6,8],
    ["VMI-002","Seal Pack","B-02","VMI-002","SET",8,4,5]
  ]
};

let D = defaultData, inv = [], vmi = [], tab = 0, res = [], shown = 0, owner = false, edit = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function sha(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}

function draft(){
  try { return localStorage.getItem(KEY) ? JSON.parse(localStorage.getItem(KEY)) : null; }
  catch (e) { return null; }
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(inv)); }
  catch (e) { alert("Could not save. Use Export."); }
}

async function load(){
  try {
    const response = await fetch("data.json?" + Date.now());
    if (!response.ok) throw new Error("No data file");
    D = await response.json();
  } catch {
    D = defaultData;
  }
  inv = Array.isArray(D.inv) ? D.inv : [];
  vmi = Array.isArray(D.vmi) ? D.vmi : [];
  if (sessionStorage.getItem(S) === "1") setOwner(true); else run();
}

function setOwner(on){
  owner = on;
  $("own").className = on ? "search-controls active" : "search-controls";
  $("adm").textContent = on ? "Log out" : "Login";
  $("who").textContent = on ? "Owner Access" : "";
  if (on) {
    sessionStorage.setItem(S, "1");
    const d = draft();
    if (d) inv = d;
  } else {
    sessionStorage.removeItem(S);
    inv = Array.isArray(D.inv) ? D.inv.slice() : [];
  }
  run();
}

function run(){
  const q = $("q").value.trim().toLowerCase();
  const f = $("fld").value;
  const src = tab ? vmi : inv;

  const match = r => {
    if (!q) return true;
    if (tab) {
      const a = [r[3], r[1], r[2], r[0]];
      const haystack = (f === "all" ? a.join(" ") : f === "0" ? r[3] : f === "1" ? r[1] : f === "3" ? r[0] : f === "7" ? r[2] : a.join(" ")).toLowerCase();
      return haystack.includes(q);
    }
    const text = f === "all" ? [r[0], r[1], r[2], r[3], r[7], r[12], r[11], r[10]].join(" ") : String(r[+f]);
    return text.toLowerCase().includes(q);
  };

  res = [];
  src.forEach((r, i) => { if (match(r)) res.push(i); });
  shown = 0;
  $("list").innerHTML = "";
  page();
}

function card(i){
  const r = inv[i];
  const st = r[5] <= 0 ? "out" : (r[8] > 0 && r[5] < r[8] ? "low" : "");
  return '<div class="c '+st+'"><div class="code">'+esc(r[0])+'</div><div class="desc">'+esc(r[1])+'</div>'+(r[2]?'<div class="long">'+esc(r[2])+'</div>':'')+
    '<div class="qty-row"><span class="qty">'+r[5]+' <small>'+esc(r[4])+'</small></span><span class="meta-inline">'+(r[6]?'VMI: '+r[6]:"")+'</span></div><div class="details-grid">'+
    [["Location",r[7]],["Min / Max",r[8]+" / "+r[9]],["Dept.",r[10]],["Area",r[11]],["End User",r[12]],["OEM",r[3]]].filter(x=>x[1]!==""&&x[1]!="0 / 0").map(x=>'<div class="detail-item"><span class="detail-label">'+x[0]+'</span><span class="detail-value">'+esc(x[1])+'</span></div>').join("")+'</div>'+
    (owner?'<div class="actions"><button class="btn-edit" data-e="'+i+'">Edit</button><button class="btn-delete" data-x="'+i+'">Delete</button></div>':'')+'</div>';
}

function vcard(i){
  const r = vmi[i];
  return '<div class="c"><div class="code">'+esc(r[3] || r[0])+'</div><div class="desc">'+esc(r[1])+'</div><div class="qty-row"><span class="qty">'+r[5]+' <small>'+esc(r[4])+'</small></span></div><div class="details-grid"><div class="detail-item"><span class="detail-label">Part No.</span><span class="detail-value">'+esc(r[0])+'</span></div><div class="detail-item"><span class="detail-label">Bin</span><span class="detail-value">'+esc(r[2])+'</span></div><div class="detail-item"><span class="detail-label">Min / Max</span><span class="detail-value">'+r[6]+" / "+r[7]+'</span></div></div></div>';
}

function page(){
  const n = Math.min(res.length, shown + 12);
  let h = "";
  for (let k = shown; k < n; k++) h += tab ? vcard(res[k]) : card(res[k]);
  if (!h && shown === 0) h = '<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">No results found. Try a different search.</div></div>';
  $("list").insertAdjacentHTML("beforeend", h);
  shown = n;
  $("more").hidden = shown >= res.length;
  $("meta").textContent = res.length + " " + (tab ? "VMI parts" : "materials") + (res.length ? "" : " — try another search") + " · Last updated " + (D && D.built ? D.built : "today");
}

function form(i){
  edit = i;
  const r = i >= 0 ? inv[i] : F.map(f => f[2] ? 0 : "");
  $("et").textContent = i >= 0 ? "Edit Material" : "Add Material";
  $("ee").textContent = "";
  $("ef").innerHTML = F.map(f => '<label><span>'+f[0]+'</span><input data-k="'+f[1]+'" '+(f[2] ? 'type="number" step="any"' : 'type="text"')+' value="'+esc(r[f[1]])+'"></label>').join("");
  $("ed").showModal();
}

$("q").oninput = run;
$("fld").onchange = run;
$("more").onclick = page;
[$("t0"),$("t1")].forEach((btn, t) => {
  btn.onclick = () => {
    tab = t;
    $("t0").classList.toggle("active", t === 0);
    $("t1").classList.toggle("active", t === 1);
    run();
  };
});
$("adm").onclick = () => {
  if (owner) setOwner(false);
  else { $("pw").value = ""; $("le").textContent = ""; $("lg").showModal(); }
};
$("lgo").onclick = async () => {
  if (await sha($("pw").value) === HASH) {
    $("lg").close();
    setOwner(true);
  } else {
    $("le").textContent = "Invalid password. Please try again.";
  }
};
$("lf").onsubmit = e => { if (e.submitter && e.submitter.id === "lgo") e.preventDefault(); };
$("add").onclick = () => form(-1);
$("list").onclick = e => {
  const b = e.target.closest("button");
  if (!b || !owner) return;
  if (b.dataset.e) form(+b.dataset.e);
  if (b.dataset.x && confirm("Delete " + inv[+b.dataset.x][0] + "?")) {
    inv.splice(+b.dataset.x, 1);
    save();
    run();
  }
};
$("sv").onclick = () => {
  const r = edit >= 0 ? inv[edit].slice() : F.map(f => f[2] ? 0 : "");
  $("ef").querySelectorAll("input").forEach(i => {
    const k = +i.dataset.k;
    const field = F.find(f => f[1] === k);
    r[k] = field && field[2] ? (+i.value || 0) : i.value.trim();
  });
  if (!r[0] || !r[1]) { $("ee").textContent = "Code and description required."; return; }
  if (inv.some((x, i) => x[0] === r[0] && i !== edit)) { $("ee").textContent = "Code already exists."; return; }
  while (r.length < 16) r.push(0);
  if (edit >= 0) inv[edit] = r; else inv.unshift(r);
  save();
  $("ed").close();
  $("q").value = r[0];
  $("fld").value = "0";
  run();
};
$("exp").onclick = () => {
  const o = Object.assign({}, D, { inv, built: new Date().toISOString().slice(0,10) });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type: "application/json" }));
  a.download = "data.json";
  a.click();
};
$("rst").onclick = () => {
  if (confirm("Discard all changes?")) {
    localStorage.removeItem(KEY);
    inv = Array.isArray(D.inv) ? D.inv.slice() : [];
    run();
  }
};

load();
</script>
</body>
</html>
